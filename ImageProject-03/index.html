<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Last Stop in Space</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
      <a-assets>
        <a-asset-item
          id="car"
          src="assets/1950s-sedan.glb">
        </a-asset-item>

        <a-asset-item
          id="gas-pump"
          src="assets/gas-pump.glb">
        </a-asset-item>
      </a-assets>

         <a-entity
        gltf-model="#car"
        position="-2 0 -7"
        rotation="0 45 0">
      </a-entity>

      <a-entity
        gltf-model="#gas-pump"
        position="2 0 -6">
      </a-entity>

      <!-- Ground -->
         <a-box position="0 -0.2 -5.5"
             width="12" height="0.4" depth="20"
             color="#424655">
      </a-box>

      <!-- Faded lane markings frame the parked sedan. -->
      <a-box position="-4.9 0.012 -5.5"
             width="0.09" height="0.02" depth="19"
             color="#DFAD68">
      </a-box>
      <a-box position="0.65 0.012 -5.5"
             width="0.09" height="0.02" depth="19"
             color="#DFAD68">
      </a-box>


      <!-- Temporary sky -->
      <a-sky src="assets/space-sky.jpg"></a-sky>

      <!-- Lighting -->
      <a-light
        type="ambient"
        color="#FFFFFF"
        intensity="0.8">
      </a-light>

      <a-light
        type="directional"
        position="-3 6 4"
        intensity="1">
      </a-light>

      <a-camera position="0 1.6 3"></a-camera>
    </a-scene>
  </body>
</html>
