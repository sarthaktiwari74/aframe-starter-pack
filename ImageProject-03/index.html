<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Last Stop in Space</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
      <a-assets>
        <a-asset-item
          id="car"
          src="assets/1950s-sedan.glb">
        </a-asset-item>

        <a-asset-item
          id="gas-pump"
          src="assets/gas-pump.glb">
        </a-asset-item>
      </a-assets>

         <a-entity
        gltf-model="#car"
        position="-2 0 -7"
        rotation="0 45 0">
      </a-entity>

      <a-entity
        gltf-model="#gas-pump"
        position="2 0 -6">
      </a-entity>

      <!-- Ground -->
      <a-plane
        position="0 -0.01 -5"
        rotation="-90 0 0"
        width="50"
        height="50"
        color="#777780">
      </a-plane>

      <!-- Temporary sky -->
      <a-sky src="assets/space-sky.jpg"></a-sky>

      <!-- Lighting -->
      <a-light
        type="ambient"
        color="#FFFFFF"
        intensity="0.8">
      </a-light>

      <a-light
        type="directional"
        position="-3 6 4"
        intensity="1">
      </a-light>

      <a-camera position="0 1.6 3"></a-camera>
    </a-scene>
  </body>
</html>
