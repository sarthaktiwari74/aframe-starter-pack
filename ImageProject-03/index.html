<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Last Stop in Space</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene
  cursor__mouse="rayOrigin: mouse; fuse: false"
  cursor__xrselect="rayOrigin: xrselect; fuse: false"
  raycaster="objects: #station-pump">
      <a-assets>
       <a-asset-item
       id="satellite"
       src="assets/satellite.glb">
      </a-asset-item>
        <a-asset-item
          id="car"
          src="assets/1950s-sedan.glb">
        </a-asset-item>

        <a-asset-item
          id="gas-pump"
          src="assets/gas-pump.glb">
        </a-asset-item>
      </a-assets>

        <a-entity
  id="departure-car"
  gltf-model="#car"
  position="-2 0 -7"
  rotation="0 45 0"

  animation__turn="
    property: rotation;
    from: 0 45 0;
    to: 0 180 0;
    dur: 1200;
    easing: easeInOutSine;
    startEvents: takeoff"

  animation__launch="
  property: object3D.position.z;
  from: -7;
  to: -100;
  delay: 1200;
  dur: 14000;
  easing: easeInQuad;
  startEvents: takeoff"

animation__rise="
  property: object3D.position.y;
  from: 0;
  to: 110;
  delay: 1200;
  dur: 14000;
  easing: easeInCubic;
  startEvents: takeoff">
</a-entity>

            <a-entity
        id="station-pump"
        gltf-model="#gas-pump"
        position="2 0 -6">
      </a-entity>

      <!-- Ground -->
         <a-box position="0 -0.2 -5.5"
             width="12" height="0.4" depth="20"
             color="#424655">
      </a-box>

      <!-- Faded lane markings frame the parked sedan. -->
      <a-box position="-4.9 0.012 -5.5"
             width="0.09" height="0.02" depth="19"
             color="#DFAD68">
      </a-box>
      <a-box position="0.65 0.012 -5.5"
             width="0.09" height="0.02" depth="19"
             color="#DFAD68">
      </a-box>
<a-entity id="departure-lights" position="0 0 5">
        <a-cylinder class="route-lamp" position="-4.9 0.045 -8.8"
                    radius="0.15" height="0.06" color="#566071"></a-cylinder>
        <a-cylinder class="route-lamp" position="0.65 0.045 -8.8"
                    radius="0.15" height="0.06" color="#566071"></a-cylinder>
        <a-cylinder class="route-lamp" position="-4.9 0.045 -11.7"
                    radius="0.15" height="0.06" color="#566071"></a-cylinder>
        <a-cylinder class="route-lamp" position="0.65 0.045 -11.7"
                    radius="0.15" height="0.06" color="#566071"></a-cylinder>
        <a-cylinder class="route-lamp" position="-4.9 0.045 -14.6"
                    radius="0.15" height="0.06" color="#566071"></a-cylinder>
        <a-cylinder class="route-lamp" position="0.65 0.045 -14.6"
                    radius="0.15" height="0.06" color="#566071"></a-cylinder>
      </a-entity>

        <a-entity position="2.8 0 -8.8" rotation="0 -10 0">
        <a-cylinder position="0 1.5 -0.2"
                    radius="0.10" height="3" color="#78848D"></a-cylinder>

        <a-box position="0 3.15 0"
               width="4.1" height="1.7" depth="0.18"
               color="#183039"></a-box>

        <a-box position="0 3.92 0.10"
               width="3.9" height="0.055" depth="0.035"
               material="shader: flat; color: #FFAB70"></a-box>

        <a-text value="ROUTE 09  /  ORBITAL SERVICE"
                position="0 3.62 0.11" align="center"
                width="3.5" wrap-count="30" color="#A1DDD5"></a-text>

        <a-text value="LAST STOP"
                position="0 3.17 0.11" align="center"
                width="3.65" wrap-count="10" color="#FFF1D5"></a-text>

        <a-text id="station-status" value="DEPARTURE LANE CLOSED"
                position="0 2.65 0.11" align="center"
                width="3.45" wrap-count="23" color="#FFAB70"></a-text>
      </a-entity>
       <a-entity
        gltf-model="#satellite"
       position="-7 5 -14"
        rotation="10 20 -10"
        scale="0.45 0.45 0.45"

        animation__float="
         property: position;
         from: -7 5 -14;
         to: -7 5.6 -14;
         dur: 3000;
         dir: alternate;
          loop: true;
          easing: easeInOutSine"

       animation__spin="
         property: rotation;
          from: 10 20 -10;
          to: 10 380 -10;
          dur: 40000;
         loop: true;
          easing: linear">
</a-entity>
      <!--sky -->
      <a-sky src="assets/space-sky.jpg"></a-sky>

      <!-- Lighting -->
      <a-light
        type="ambient"
        color="#FFFFFF"
        intensity="0.8">
      </a-light>

      <a-light
        type="directional"
        position="-3 6 4"
        intensity="1">
      </a-light>

      <a-camera position="0 1.6 3"></a-camera>
    </a-scene>
        <script>
      const pump = document.querySelector('#station-pump');
      const sign = document.querySelector('#station-status');
      const lamps = document.querySelectorAll('#departure-lights .route-lamp');

      sign.setAttribute('value', 'LANE CLOSED / USE PUMP');

      pump.addEventListener('click', function restorePower() {
        sign.setAttribute('value', 'RESTORING POWER...');

        lamps.forEach((lamp, index) => {
          const pair = Math.floor(index / 2);
          const delay = 450 + pair * 550;

          window.setTimeout(() => {
            lamp.setAttribute('material', {
              shader: 'flat',
              color: '#82FFE0'
            });

           if (index === lamps.length - 1) {
  sign.setAttribute('value', 'ROUTE 09 OPEN');
  sign.setAttribute('color', '#82FFE0');

  document.querySelector('#departure-car')
    .emit('takeoff', null, false);
}
          }, delay);
        });
      }, { once: true });
      
    </script>
  </body>
</html>
