<!DOCTYPE html>
<html>
  <head>
    <title>Unreal Summer World</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-cone
        position="-1 0.7 -3.5"
        radius-bottom="0"
        radius-top="0.5"
        height="1.2"
        src="../02-Adding-textures-to-sky-and-primitives/Assets/texture3.jpg">
      </a-cone>

      <a-sphere
        position="-1 1.55 -3.5"
        radius="0.58"
        color="#FFB6C1">
      </a-sphere>
    <a-entity position="1.2 1.25 -3.5" rotation="15 -20 -10">

  <a-box
    position="0 0.3 0"
    width="1.2"
    height="0.15"
    depth="0.7"
    src="../02-Adding-textures-to-sky-and-primitives/Assets/texture3.jpg">
  </a-box>

  <a-box
    position="0 0 0"
    width="1.1"
    height="0.45"
    depth="0.6"
    color="#FFF3DC">
  </a-box>

  <a-box
    position="0 -0.3 0"
    width="1.2"
    height="0.15"
    depth="0.7"
    src="../02-Adding-textures-to-sky-and-primitives/Assets/texture3.jpg">
    </a-box>
</a-entity>

      <a-sky src="../summer.jpg"></a-sky>
    </a-scene>
  </body>
</html>
